[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-signal-lab"
version = "0.1.0"
description = "MCP server that gives Claude a communications lab: BER, OFDM, eye diagrams, spectra and link budgets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jaafar Salim" }]
dependencies = ["mcp>=2.0", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest", "pillow"]

[project.scripts]
signal-lab = "signallab.server:main"

[tool.setuptools]
packages = ["signallab"]
